<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Slate Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0d1424"/>
      <stop offset="85%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Molten Metal Ironbow Radiometric Thermal Gradient -->
    <linearGradient id="ironbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="20%" stop-color="#431407"/>
      <stop offset="40%" stop-color="#991b1b"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="95%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Molten Liquid Aluminum Bath Gradient -->
    <linearGradient id="moltenAlBath" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="90%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Floating Salt Flux & Dross Layer -->
    <linearGradient id="saltFluxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Oxy-Fuel Supersonic Burner Flame Gradient -->
    <linearGradient id="burnerFlame" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="15%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#ea580c"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Laser & Spectroscopic LIBS Pulse -->
    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Engineering Grid Pattern -->
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.7"/>
      <circle cx="0" cy="0" r="1.2" fill="#334155" fill-opacity="0.6"/>
    </pattern>

    <!-- Subtle Glow Filters -->
    <filter id="glowWarm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title-main { font-weight: 800; letter-spacing: -0.03em; }
    .title-sub { font-weight: 700; letter-spacing: -0.02em; }
    .body-desc { font-weight: 400; letter-spacing: 0.005em; line-height: 1.5; }
    .badge-mono { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
    .hud-label { font-size: 9.5px; font-weight: 600; letter-spacing: 0.05em; }
  </style>

  <!-- Deep Slate Engineering Canvas -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#cadGrid)"/>

  <!-- Top Border Accent Line -->
  <rect x="0" y="0" width="1200" height="2" fill="#0284c7" opacity="0.8"/>

  <!-- ======================================================== -->
  <!-- RIGHT SIDE: ROTARY FURNACE & THERMOGRAPHY DIGITAL TWIN  -->
  <!-- ======================================================== -->
  <g transform="translate(760, 20)">

    <!-- Technical Boundary & Frame -->
    <rect x="0" y="10" width="415" height="315" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" opacity="0.95"/>
    
    <!-- Header bar of digital twin card -->
    <rect x="0" y="10" width="415" height="28" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="28" width="415" height="10" fill="#111c33"/>
    <circle cx="16" cy="24" r="3.5" fill="#22c55e"/>
    <text x="28" y="27" fill="#94a3b8" class="font-mono hud-label">TRF-01 DIGITAL TWIN • PYROMETALLURGICAL CELL</text>
    <text x="345" y="27" fill="#38bdf8" class="font-mono hud-label">OPC-UA LIVE</text>

    <!-- Crosshair coordinates -->
    <path d="M 200 45 L 200 315 M 10 180 L 405 180" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 4"/>

    <!-- ========================================== -->
    <!-- TILTING ROTARY FURNACE (TRF) CROSS-SECTION -->
    <!-- ========================================== -->
    <g transform="translate(195, 175)">
      
      <!-- Outer Steel Shell (Cylinder) -->
      <circle cx="0" cy="0" r="116" fill="#1e293b" stroke="#475569" stroke-width="3"/>
      
      <!-- Outer Insulation Layer (Microporous / Board) -->
      <circle cx="0" cy="0" r="108" fill="#334155" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/>
      
      <!-- Safety / Intermediate Castable Refractory -->
      <circle cx="0" cy="0" r="98" fill="#78350f" opacity="0.8"/>
      
      <!-- Working Refractory Hot-Face Lining (High Alumina / Corundum-Mullite) -->
      <circle cx="0" cy="0" r="88" fill="#991b1b" stroke="#ea580c" stroke-width="1.5"/>

      <!-- Furnace Inner Chamber Free Volume -->
      <circle cx="0" cy="0" r="76" fill="#0f172a"/>

      <!-- Molten Aluminum Bath (Lower section of chamber) -->
      <path d="M -70 20 Q 0 25 70 20 A 76 76 0 0 1 -70 20 Z" fill="url(#moltenAlBath)" opacity="0.95"/>

      <!-- Floating Dross & Salt Flux Layer (Strip oxide film) -->
      <path d="M -69 16 C -35 14 35 14 69 16 L 70 21 C 35 23 -35 23 -70 21 Z" fill="url(#saltFluxGrad)" opacity="0.9"/>
      
      <!-- Oxy-Fuel Burner Flame Cone (Upper combustion chamber) -->
      <path d="M -74 -10 C -30 -30 20 -25 60 -5 C 20 -2 -20 -5 -74 -10 Z" fill="url(#burnerFlame)" opacity="0.95" filter="url(#glowWarm)"/>
      <ellipse cx="-45" cy="-12" rx="18" ry="6" fill="#ffffff" opacity="0.85"/>

      <!-- Furnace Rotation Indicator Arrow -->
      <path d="M 0 -102 A 102 102 0 0 1 72 -72" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <polygon points="72,-72 70,-80 78,-74" fill="#38bdf8"/>
      <text x="15" y="-106" fill="#38bdf8" class="font-mono" font-size="8.5">ω = 1.8 RPM</text>

      <!-- Radiometric Isotherm Scan Reticle on Refractory Hotspot -->
      <circle cx="68" cy="40" r="16" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 3"/>
      <circle cx="68" cy="40" r="3" fill="#fef08a" filter="url(#glowWarm)"/>
      <line x1="68" y1="20" x2="68" y2="60" stroke="#ef4444" stroke-width="0.8"/>
      <line x1="48" y1="40" x2="88" y2="40" stroke="#ef4444" stroke-width="0.8"/>

      <!-- Callout: Shell Temperature -->
      <polyline points="68,40 105,75 160,75" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
      <circle cx="160" cy="75" r="2.5" fill="#f59e0b"/>
      <text x="110" y="70" fill="#f59e0b" class="font-mono hud-label">T_hotspot: 342.8°C</text>
      <text x="110" y="87" fill="#64748b" class="font-mono" font-size="8">IR LWIR • ε = 0.88</text>

      <!-- Callout: Molten Bath Temperature -->
      <polyline points="0,45 -35,75 -85,75" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
      <circle cx="-85" cy="75" r="2.5" fill="#cbd5e1"/>
      <text x="-165" y="70" fill="#cbd5e1" class="font-mono hud-label">T_bath: 752.4°C</text>
      <text x="-165" y="87" fill="#64748b" class="font-mono" font-size="8">Al-Si-Mg • PYRO</text>
    </g>

    <!-- LIBS / Spectroscopic Sorting Beam (Bottom Banner in Card) -->
    <g transform="translate(15, 255)">
      <rect width="385" height="58" rx="6" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Laser pulse line -->
      <line x1="20" y1="29" x2="110" y2="29" stroke="url(#laserBeamGrad)" stroke-width="2.5" filter="url(#glowCyan)"/>
      <polygon points="110,29 105,26 105,32" fill="#06b6d4"/>
      
      <!-- Target scrap piece -->
      <polygon points="116,22 135,18 142,38 120,40" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
      <!-- Plasma emission spark -->
      <circle cx="116" cy="29" r="4" fill="#ffffff" filter="url(#glowWarm)"/>

      <!-- Spectroscopy readouts -->
      <text x="155" y="24" fill="#38bdf8" class="font-mono hud-label">LIBS SORTING: EN AW-6082</text>
      <text x="155" y="38" fill="#94a3b8" class="font-mono" font-size="8.5">Al I: 396.1nm • Mg I: 285.2nm • Si: 0.92%</text>
      <text x="155" y="50" fill="#22c55e" class="font-mono" font-size="8.5">SORTING CONFIDENCE: 99.4% [WROUGHT]</text>
    </g>

  </g>

  <!-- ======================================================== -->
  <!-- LEFT & CENTER: BRANDING, TITLE, TYPOGRAPHY, SCOPE        -->
  <!-- ======================================================== -->
  <g transform="translate(60, 42)">

    <!-- Category Pill Tag (Zero Emojis, Senior Engineering Style) -->
    <g>
      <rect width="470" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="4.5" fill="#f97316"/>
      <text x="28" y="17" fill="#94a3b8" class="font-mono badge-mono">
        SECONDARY PYROMETALLURGY • RADIOMETRIC IR • SENSOR SORTING • CASTHOUSE AI
      </text>
    </g>

    <!-- Main Repository Title -->
    <text x="0" y="78" fill="#f8fafc" class="font-sans title-main" font-size="34">
      Awesome Secondary Aluminum Recycling
    </text>
    <text x="0" y="118" fill="#38bdf8" class="font-sans title-sub" font-size="28">
      &amp; Industrial Pyrometallurgy
    </text>

    <!-- Domain Description & Scope -->
    <text x="0" y="162" fill="#cbd5e1" class="font-sans body-desc" font-size="14.5">
      A canonical, scientifically curated directory of computational metallurgy,
    </text>
    <text x="0" y="186" fill="#cbd5e1" class="font-sans body-desc" font-size="14.5">
      radiometric thermography engines, laser spectroscopy (LIBS), furnace combustion kinetics,
    </text>
    <text x="0" y="210" fill="#94a3b8" class="font-sans body-desc" font-size="14.5">
      refractory lining diagnostics, salt flux chemistry, and smart casthouse IIoT standards.
    </text>

    <!-- Engineering Disciplines / Technical Pillars -->
    <g transform="translate(0, 248)">
      
      <!-- Discipline 1: Spectroscopic Scrap Sorting -->
      <g transform="translate(0, 0)">
        <rect width="128" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <rect x="8" y="10" width="10" height="12" rx="2" fill="#0284c7"/>
        <text x="24" y="21" fill="#e2e8f0" class="font-sans" font-size="11.5" font-weight="600">LIBS / XRF Sorting</text>
      </g>

      <!-- Discipline 2: Rotary Furnace Kinetics -->
      <g transform="translate(136, 0)">
        <rect width="138" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <rect x="8" y="10" width="10" height="12" rx="2" fill="#ea580c"/>
        <text x="24" y="21" fill="#e2e8f0" class="font-sans" font-size="11.5" font-weight="600">Furnace Kinetics</text>
      </g>

      <!-- Discipline 3: Refractory Thermography -->
      <g transform="translate(282, 0)">
        <rect width="144" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <rect x="8" y="10" width="10" height="12" rx="2" fill="#ef4444"/>
        <text x="24" y="21" fill="#e2e8f0" class="font-sans" font-size="11.5" font-weight="600">IR Thermography</text>
      </g>

      <!-- Discipline 4: Salt Flux & Dross -->
      <g transform="translate(434, 0)">
        <rect width="126" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <rect x="8" y="10" width="10" height="12" rx="2" fill="#d97706"/>
        <text x="24" y="21" fill="#e2e8f0" class="font-sans" font-size="11.5" font-weight="600">Salt Flux &amp; Dross</text>
      </g>

      <!-- Discipline 5: Plant IIoT & Telemetry -->
      <g transform="translate(568, 0)">
        <rect width="118" height="32" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <rect x="8" y="10" width="10" height="12" rx="2" fill="#6366f1"/>
        <text x="24" y="21" fill="#e2e8f0" class="font-sans" font-size="11.5" font-weight="600">OPC-UA Telemetry</text>
      </g>

    </g>

  </g>

  <!-- ======================================================== -->
  <!-- BOTTOM RADIOMETRIC IRONBOW CALIBRATION COLORBAR          -->
  <!-- ======================================================== -->
  <g transform="translate(0, 355)">
    <!-- Continuous Thermal Gradient Bar -->
    <rect x="0" y="0" width="1200" height="6" fill="url(#ironbowGrad)"/>

    <!-- Subtle Temperature Graduation Marks -->
    <g transform="translate(60, 16)" fill="#64748b" class="font-mono" font-size="8.5">
      <text x="0" y="0">CALIBRATION SCALE:</text>
      <text x="180" y="0">100°C [PREHEAT]</text>
      <text x="380" y="0">350°C [DECOATING]</text>
      <text x="590" y="0">660°C [AL MELTING POINT]</text>
      <text x="810" y="0">850°C [ROTARY BATH]</text>
      <text x="1010" y="0">1400°C [OXY-FUEL FLAME]</text>
    </g>
  </g>

</svg>
